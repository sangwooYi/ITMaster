<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container">
    <h3 class="my-3">Person 정보 수정</h3>

    <form th:object="${person}" th:action method="post" class="col-3">
        <div class="input-group my-2">
            <label th:for="*{userId}" class="input-group-text">유저 ID :</label>
            <input th:value="*{userId}" th:field="*{userId}" readonly class="form-control"/>
        </div>
        <div class="input-group my-2">
            <label th:for="*{userName}" class="input-group-text">이름 : </label>
            <input th:value="*{userName}" th:field="*{userName}" class="form-control"/>
        </div>
        <div class="input-group my-2">
            <label th:for="*{age}" class="input-group-text">나이 : </label>
            <input th:value="*{age}"  th:field="*{age}" class="form-control"/>
        </div>

        <button type="submit" class="btn btn-secondary text-light">수정</button>
    </form>

    <button class="btn btn-secondary my-3"><a th:href="@{/person/all}" class="text-light link-underline link-underline-opacity-0">전체화면</a></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
