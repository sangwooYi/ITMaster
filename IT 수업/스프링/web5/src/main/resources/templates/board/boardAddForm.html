<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://i.namu.wiki/i/_gAD8r8NImxVgRK31XohV58sp3zmDZGi1u73QyTUgwWeg15Sve1n-5nQqcLctSugUvVmlqSOP1sJ6iLUWczcvg.webp">
    <title>Aim Store</title>

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.4/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .img-back {
            background-image: url("/img/aimyon5.png");
            background-size: cover;
            height: 100vh;
            width: 100%;
            z-index: -99;
            position: absolute;
            top: 0px;
        }
        .img-back::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0.1;
            z-index: -1;
        }
    </style>

</head>
<body>
    <span class="img-back"></span>

    <div class="container text-center" style="margin: 5px auto;">
        <!-- 첨부파일 넘기려면 enctype 설정 되어있어야 함 ! -->
        <form th:action method="post" th:object="${board}" enctype="multipart/form-data">
            <h2>[ 글쓰기 ]</h2>
            <table class="my-3" style="border-spacing: 20px;">
                <colgroup>
                    <col style="width: 30%">
                    <col style="width: 70%">
                </colgroup>
                <tr>
                    <th><label for="title">제목</label></th>
                    <td><input  id="title" name="title" th:value="*{title}" class="form-control"></td>
                </tr>
                <tr>
                    <th>내용</th>
                    <td><textarea name="content" th:value="*{content}" style="resize: none" class="form-control"></textarea></td>
                </tr>
                <tr>
                    <th><label for="uploadFile">첨부파일</label></th>
                    <td><input type="file" id="uploadFile" name="uploadFile"  class="form-control"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <button type="submit" class="btn btn-primary">글 작성</button>
                        <button type="button" th:onclick="|location.href='@{/}'|" class="btn btn-secondary">돌아가기</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.4/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
