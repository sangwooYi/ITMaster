<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://i.namu.wiki/i/_gAD8r8NImxVgRK31XohV58sp3zmDZGi1u73QyTUgwWeg15Sve1n-5nQqcLctSugUvVmlqSOP1sJ6iLUWczcvg.webp">
    <title>Aim Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #join-form {
            width: 600px;
            padding: 10px 30px;
            margin-left: 5vw;
            background-color: aliceblue;
            border-radius: 10px;
        }
        .in-row {
            position: relative;
        }
        .field-error {
            border-color: #dc3545;
            color: #dc3545;
        }
        .img-back {
            background-image: url("/img/aimyon5.png");
            background-size: cover;
            height: 100vh;
            width: 100%;
            z-index: -99;
            position: absolute;
            top: 0px;
        }
        .img-back::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0.1;
            z-index: -1;
        }
    </style>
</head>
<body>
    <span class="img-back"></span>


    <input type="hidden" th:value="${chkResult}" id="chkResult">

    <form class="d-flex flex-column col-12 my-5 shadow p-3 my-5 bg-body-tertiary rounded" id="join-form" th:action="@{/member/info}" method="post" th:object="${member}">
        <input type="hidden" th:value="*{password}" th:field="*{password}">
        <input type="hidden" th:value="*{roleName}" th:field="*{roleName}">
        <input type="hidden" th:value="*{isActive}" th:field="*{isActive}">

        <h2 class="text-center my-4">[ 개인정보 수정 ]</h2>
        <div class="mb-3 d-flex flex-row in-row">
            <label for="userId" class="form-label col-3">ID</label>
            <input type="text" class="form-control" id="userId" th:field="*{userId}" th:value="*{userId}" th:errorclass="field-error" readonly style="background: lightgray">
        </div>
        <div class="mb-3  d-flex flex-row in-row">
            <label for="userName" class="form-label col-3">이름</label>
            <input type="text" class="form-control" id="userName" th:field="*{userName}" th:value="*{userName}" th:errorclass="field-error">
        </div>
        <div class="mb-3  d-flex flex-row in-row">
            <label for="mailAddress" class="form-label col-3">이메일</label>
            <input type="text" class="form-control" id="mailAddress" th:field="*{mailAddress}" th:value="*{mailAddress}" th:errorclass="field-error">
        </div>
        <div class="mb-3  d-flex flex-row in-row">
            <label for="phoneNumber" class="form-label col-3">전화번호</label>
            <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" th:value="*{phoneNumber}" th:errorclass="field-error">
        </div>
        <div class="mb-3  d-flex flex-row in-row">
            <label for="address" class="form-label col-3">주소</label>
            <input type="text" class="form-control" id="address" th:field="*{address}" th:value="*{address}" th:errorclass="field-error">
        </div>
        <div class="mb-3  d-flex flex-row in-row" id="chkPasswordBox">
            <input class="form-control" id="chkPassword" name="chkPassword" placeholder="비밀번호 변경을 위해서 기존비밀번호를 입력해주세요">
            <button type="button" id="chkPasswordBtn" class="mx-2 btn btn-primary col-3">확인</button>
        </div>
        <div class="mb-3  d-flex flex-row in-row d-none" id="upPasswordBox">
            <label for="updatePassword" class="form-label col-3">비밀번호 변경</label>
            <div class="d-flex flex-column col">
                <input type="password" class="form-control mb-3" id="updatePassword" placeholder="비밀번호 입력" th:field="*{updatePassword}" th:value="*{updatePassword}" th:errorclass="field-error">
                <input type="password" class="form-control" id="passwordRe"  placeholder="비밀번호 다시 입력" th:field="*{passwordRe}" th:value="*{passwordRe}" th:errorclass="field-error">
            </div>
        </div>

        <div class="mb-3  d-flex flex-row col-6 align-items-center" style="margin: 5px auto;">
            <button type="submit" class="mx-2 btn btn-primary col">수정</button>
            <button type="button" class="mx-2 btn btn-secondary col"><a class="text-light link-underline link-underline-opacity-0" th:href="@{/}">돌아가기</a></button>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>

        const chkPasswordBtn = document.getElementById('chkPasswordBtn');

        document.addEventListener('DOMContentLoaded', () => {

            const chkPassword = document.getElementById('chkResult').value;

            const chkPasswordBox = document.getElementById('chkPasswordBox');
            const upPasswordBox = document.getElementById('upPasswordBox');

            if (chkPassword == 'true') {

                // d-none 없으면 추가
                if (!chkPasswordBox.classList.contains('d-none')) {
                    chkPasswordBox.classList.add('d-none');
                }
                // d-none 있으면 삭제
                if (upPasswordBox.classList.contains('d-none')) {
                    upPasswordBox.classList.remove('d-none');
                }
            } else {
                // d-none 있으면 삭제
                if (chkPasswordBox.classList.contains('d-none')) {
                    chkPasswordBox.classList.remove('d-none');
                }
                // d-none 없으면 추가
                if (!upPasswordBox.classList.contains('d-none')) {
                    upPasswordBox.classList.add('d-none');
                }

                if (chkPassword == 'false') {

                    setTimeout(() => {
                        alert("기존 비밀번호와 다릅니다.");
                    }, 100)

                }
            }

        })

        chkPasswordBtn.addEventListener('click', () => {

            const chkPassword = document.getElementById('chkPassword').value;
            const userId = document.getElementById('userId').value;
            if (chkPassword.trim() == '') {
                alert("값을 입력해 주세요");
                return;
            }

            location.href = `/member/chkpassword?userId=${userId}&chkPassword=${chkPassword}`

        })
    </script>
</body>
</html>
