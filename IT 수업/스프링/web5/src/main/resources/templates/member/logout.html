    <p>logout</p>
    <p>잠시후에 로그인 됩니다.</p>

    <form th:action method="post" id="logout">

        function goLogout() {
            const curForm = document.getElementById('logout');
            curForm.submit();
        }
        setTimeout(goLogout, 500);

    </script>
