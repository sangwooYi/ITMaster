<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://i.namu.wiki/i/_gAD8r8NImxVgRK31XohV58sp3zmDZGi1u73QyTUgwWeg15Sve1n-5nQqcLctSugUvVmlqSOP1sJ6iLUWczcvg.webp">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        #join-form {
            width: 600px;
            padding: 10px 30px;
            margin-left: 5vw;
            background-color: aliceblue;
            border-radius: 10px;
        }
        .in-row {
            position: relative;
        }
        .field-error {
            border-color: #dc3545;
            color: #dc3545;
        }
        .img-back {
            background-image: url("/img/aimyon3.png");
            background-size: cover;
            height: 100vh;
            width: 100%;
            z-index: -99;
            position: absolute;
            top: 0px;
        }
        .img-back::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0.1;
            z-index: -1;
        }
    </style>
</head>
<body>
    <span class="img-back"></span>
    <input type="hidden" th:value="${isDuplicate}" id="isDuplicate">
    <form class="d-flex flex-column col-12 my-5 shadow p-3 my-5 bg-body-tertiary rounded" id="join-form" th:action="@{/member/join}" method="post" th:object="${member}">
        <h2 class="text-center my-4">[ 회원가입 ]</h2>
        <input type="hidden" id="dupChecked" name="dupChecked" value="false">
        <div class="mb-3 d-flex flex-row in-row">
            <label for="userId" class="form-label col-3">ID</label>
            <input type="text" class="form-control" id="userId" th:field="*{userId}" th:value="*{userId}" th:errorclass="field-error">
            <button type="button" class="col-3 mx-2 btn btn-secondary" id="dupCheckBtn">중복 확인</button>
        </div>
        <div class="mb-3  d-flex flex-row in-row">
            <label for="password" class="form-label col-3">비밀번호</label>
            <div class="d-flex flex-column col">
                <input type="password" class="form-control mb-3" id="password" placeholder="비밀번호 입력" th:field="*{password}" th:value="*{password}" th:errorclass="field-error">
                <input type="password" class="form-control" id="passwordRe"  placeholder="비밀번호 다시 입력" th:field="*{passwordRe}" th:value="*{passwordRe}" th:errorclass="field-error">
            </div>
        </div>
        <div class="mb-3  d-flex flex-row in-row">
            <label for="userName" class="form-label col-3">이름</label>
            <input type="text" class="form-control" id="userName" th:field="*{userName}" th:value="*{userName}" th:errorclass="field-error">
        </div>
        <div class="mb-3  d-flex flex-row in-row">
            <label for="mailAddress" class="form-label col-3">이메일</label>
            <input type="text" class="form-control" id="mailAddress" th:field="*{mailAddress}" th:value="*{mailAddress}" th:errorclass="field-error">
        </div>
        <div class="mb-3  d-flex flex-row in-row">
            <label for="phoneNumber" class="form-label col-3">전화번호</label>
            <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" th:value="*{phoneNumber}" th:errorclass="field-error">
        </div>
        <div class="mb-3  d-flex flex-row in-row">
            <label for="address" class="form-label col-3">주소</label>
            <input type="text" class="form-control" id="address" th:field="*{address}" th:value="*{address}" th:errorclass="field-error">
        </div>
        <div class="mb-3  d-flex flex-row col-6 align-items-center" style="margin: 5px auto;">
            <button type="submit" class="mx-2 btn btn-primary col">가입</button>
            <button type="button" class="mx-2 btn btn-secondary col"><a class="text-light link-underline link-underline-opacity-0" th:href="@{/member/join}">다시 쓰기</a></button>
        </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const isDuplicate = document.getElementById('isDuplicate').value.trim();

            if (isDuplicate == 'true') {
                document.getElementById('dupChecked').value = 'false';
                setTimeout(() => {
                    alert("아이디가 중복됩니다.");
                }, 100)
            } else if (isDuplicate == 'false') {
                document.getElementById('dupChecked').value = 'true';
                setTimeout(() => {
                    alert("아이디 사용 가능합니다.");
                }, 100)
            } else {
                document.getElementById('dupChecked').value = 'false';
            }

        })

        document.getElementById('dupCheckBtn').addEventListener('click', () => {

            const chkId = document.getElementById('userId').value.trim();

            if (chkId == '') {
                alert("값을 입력해 주세요");
            } else {
                const userId = document.getElementById('userId').value;
                const password = document.getElementById('password').value;
                const passwordRe = document.getElementById('passwordRe').value;
                const userName = document.getElementById('userName').value;
                const mailAddress = document.getElementById('mailAddress').value;
                const phoneNumber = document.getElementById('phoneNumber').value;
                const address = document.getElementById('address').value;

                location.href = `/member/checkId?userId=${userId}&password=${password}&passwordRe=${passwordRe}&userName=${userName}&mailAddress=${mailAddress}&phoneNumber=${phoneNumber}&address=${address}`;
            }
        });
    </script>
</body>
</html>
