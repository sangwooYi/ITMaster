<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://i.namu.wiki/i/_gAD8r8NImxVgRK31XohV58sp3zmDZGi1u73QyTUgwWeg15Sve1n-5nQqcLctSugUvVmlqSOP1sJ6iLUWczcvg.webp">
    <title>Aim Store</title>

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.4/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .img-back {
            background-image: url("/img/aimyon4.png");
            background-size: cover;
            height: 100vh;
            width: 100%;
            z-index: -99;
            position: absolute;
            top: 0px;
        }
        .img-back::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0.1;
            z-index: -1;
        }

        #search-form {
            width: 600px;
            margin: 5px auto;
            padding: 30px;
        }
    </style>
</head>
<body>
    <span class="img-back"></span>

    <div id="search-form" class="shadow p-3 my-5 bg-body-tertiary rounded"  style="z-index: 99">
        <form th:action="@{/member/findId}" method="post" id="searchForm">
            <h4 class="text-center mb-3">아이디 찾기</h4>
            <div class="input-form my-3">
                <label for="userName">이름</label>
                <input id="userName" type="text" name="userName" class="form-control" th:value="${userName}">
            </div>
            <div class="input-form my-3">
                <label for="mailAddress">이메일</label>
                <input id="mailAddress" type="text" name="mailAddress" class="form-control" th:value="${mailAddress}">
            </div>
            <div class="input-form my-3">
                <button type="submit" class="btn btn-primary" id="searchBtn">검색</button>
                <button type="button" class="btn btn-secondary" th:onclick="|location.href='@{/}'|">홈으로</button>
            </div>
        </form>
        <div th:if="${msg ne ''}">
            <h5 class="text-center">[ 아이디 검색 결과 ]</h5>
            <p class="text-center" th:text="${msg}"></p>
        </div>
    </div>
    <script>
        document.getElementById('searchBtn').addEventListener('click', () => {

            const userName = document.getElementById('userName').trim();
            const mailAddress = document.getElementById('mailAddress').trim();

            if (userName == '' || mailAddress == '') {
                Swal.fire({
                    icon: "warning",
                    title: "입력 값 누락",
                    text: "성함, 이메일 모두 입력해 주세요"
                });
                return;
            }
            document.getElementById('searchForm').submit();
        })
    </script>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.4/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
