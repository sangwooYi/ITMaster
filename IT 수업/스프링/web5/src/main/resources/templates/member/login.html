<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://i.namu.wiki/i/_gAD8r8NImxVgRK31XohV58sp3zmDZGi1u73QyTUgwWeg15Sve1n-5nQqcLctSugUvVmlqSOP1sJ6iLUWczcvg.webp">
    <title>Aim Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #join-form {
            background-color: white;
            width: 400px;
            height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10vw 15vw;
        }
        #join-form label {
            font-weight: bold;
            font-size: 15px;
        }
        .input-form {
            width: 320px;
        }
        .input-form button {
            width: 100%;
        }
        .field-error {
            border-color: #dc3545;
            color: #dc3545;
        }
        .img-back {
            background-image: url("/img/aimyon.png");
            background-size: cover;
            height: 100vh;
            width: 100%;
            z-index: -99;
            position: absolute;
            top: 0px;
        }
        .img-back::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0.1;
            z-index: -1;
        }
    </style>
</head>
<body>
    <span class="img-back"></span>
    <div id="join-form" class="shadow p-3 my-5 bg-body-tertiary rounded"  style="z-index: 99">
        <form th:action th:object="${user}" method="post">
            <h4 class="text-center mb-3">로그인</h4>
            <div class="field-error" th:if="${param.error}" style="font-weight: bold">ID 혹은 비밀번호 틀립니다.</div>
            <div class="input-form my-3">
                <label for="userId">아이디</label>
                <input id="userId" type="text" th:field="*{userId}" class="form-control" th:errorclass="field-error">
                <div th:errors="*{userId}" class="field-error"></div>
            </div>
            <div class="input-form my-3">
                <label for="password">비밀번호</label>
                <input id="password" type="password" th:field="*{password}" class="form-control" th:errorclass="field-error">
                <div th:errors="*{password}" class="field-error"></div>
            </div>
            <div class="input-form my-3">
                <button type="submit" class="btn btn-primary">로그인</button>
                <button type="button" class="btn btn-secondary mt-2" th:onclick="|location.href='@{/member/join}'|">회원가입</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
