<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://i.namu.wiki/i/_gAD8r8NImxVgRK31XohV58sp3zmDZGi1u73QyTUgwWeg15Sve1n-5nQqcLctSugUvVmlqSOP1sJ6iLUWczcvg.webp">
    <title>Aim Store</title>

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.4/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>

        #search-form {
            background-color: white;
            display: flex;
            flex-direction: row;
            align-items: center;
            width: 50%;
            transform: translate(0, 35px);
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
        }
        #detail-search {
            background-color: white;
            display: flex;
            flex-direction: row;
            align-items: center;
            width: 65%;
            transform: translate(0, 35px);
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
        }

        .img-back {
            background-image: url("/img/aimyon6.png");
            height: 100vh;
            width: 100%;
            z-index: -99;
            position: absolute;
            top: 0px;
        }
        .img-back::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0.1;
            z-index: -1;
        }
        #chkBox {
            transform: translate(0, 80px);
        }
    </style>
</head>
<body>
    <span class="img-back"></span>
    <h2 class="text-center my-4">[ 회원 검색 ]</h2>
    <!-- 검색창   -->

    <div class="container">
        <div class="form-check" id="chkBox">
            <input class="form-check-input" type="checkbox"  id="detailSearch" th:checked="${isChecked eq true}">
            <label class="form-check-label" for="detailSearch" style="font-size: 12px; font-weight: bold;">
                상세검색
            </label>
        </div>
        <!-- th:action 만쓰면 그냥 기존경로 그대로 다시보내주는거
        따라서 form 두개 이상이면 반드시 경로 명시해 줘야 함 -->
        <form th:action="@{/member/search}" method="post" class="mt-5" id="search-form">
            <label for="searchText" class="col-2">회원검색: </label>
            <select class="form-select mx-2" aria-label="Default select example" name="category"
                    th:value="${category}" style="width: 150px;" id="category">
                <option value="userId" th:selected="${category == 'userId'}">아이디</option>
                <option value="userName" th:selected="${category == 'userName'}">이름</option>
            </select>
            <input id="searchText" name="searchText" class="form-control mx-2"
                   th:value="${searchText}" style="width: 400px">
            <button class="btn btn-secondary btn-sm col-2" id="searchUser">검색</button>
        </form>

        <form th:action="@{/member/searchDetail}" method="post" class="mt-5 d-none" id="detail-search">
            <span for="searchText" class="col-1 me-3">상세검색: </span>
            <label for="searchName">이름</label>
            <input id="searchName" th:value="${searchName}" name="searchName" class="form-control mx-2 col">
            <label for="searchMail">이메일</label>
            <input id="searchMail" th:value="${searchMail}" name="searchMail" class="form-control mx-2 col">
            <label for="searchNumber">전화번호</label>
            <input id="searchNumber" th:value="${searchNumber}" name="searchNumber" class="form-control mx-2 col">
            <button class="btn btn-secondary btn-sm col-1" id="searchDetail">검색</button>
        </form>
        <!-- 회원 결과   -->
        <table class="table table-striped my-5">
            <colgroup>
                <col style="width: 10%;">
                <col style="width: 20%;">
                <col style="width: 20%;">
                <col style="width: 25%;">
                <col style="width: 25%;">
            </colgroup>
            <thead class="table-secondary">
                <tr>
                    <th>No.</th>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>연락처</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member, status : ${memberList}">
                    <td th:text="${status.count}"></td>
                    <td th:text="${member.userId}"></td>
                    <td th:text="${member.userName}"></td>
                    <td th:text="${member.mailAddress}"></td>
                    <td th:text="${member.phoneNumber}"></td>
                </tr>
            </tbody>
        </table>
        <button class="btn btn-secondary btn-lg" th:onclick="|location.href='@{/}'|">홈으로</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.4/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const searchForm = document.getElementById('search-form');
        const detailSearchForm = document.getElementById('detail-search');

        document.addEventListener('DOMContentLoaded', () => {
            const checkBox = document.getElementById('detailSearch');
            if (checkBox.checked) {
                detailSearchForm.classList.remove('d-none');
                searchForm.classList.add('d-none');
            } else { // 하나만 검색
                searchForm.classList.remove('d-none');
                detailSearchForm.classList.add('d-none');
            }
        })

        document.getElementById('searchUser').addEventListener('click', (e) => {
            e.preventDefault();

            const searchText = document.getElementById('searchText').value.trim();


            if (searchText == '') {
                Swal.fire({
                    icon: "warning",
                    title: "입력 값 누락",
                    text: "검색할 값을 입력해 주세요"
                });
                return;
            }
            searchForm.submit();
        })

        document.getElementById('searchDetail').addEventListener('click', () => {

            const userName = document.getElementById('searchName').trim();
            const mailAddress = document.getElementById('searchMail').trim();
            const phoneNumber = document.getElementById('searchNumber').trim();

            if (userName == '' && mailAddress == '' && phoneNumber == '') {
                Swal.fire({
                    icon: "warning",
                    title: "입력 값 누락",
                    text: "최소한 하나의 값은 입력해 주세요"
                });
                return;
            }
            detailSearchForm.submit();
        })

        document.getElementById('detailSearch').addEventListener('click', (e) => {

            const checkBox = e.target;

            // 상세
            if (checkBox.checked) {
                detailSearchForm.classList.remove('d-none');
                searchForm.classList.add('d-none');
            } else { // 하나만 검색
                searchForm.classList.remove('d-none');
                detailSearchForm.classList.add('d-none');
            }

        })
    </script>
</body>
</html>
