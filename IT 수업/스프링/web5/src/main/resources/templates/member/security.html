<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://i.namu.wiki/i/_gAD8r8NImxVgRK31XohV58sp3zmDZGi1u73QyTUgwWeg15Sve1n-5nQqcLctSugUvVmlqSOP1sJ6iLUWczcvg.webp">
    <title>Aim Store</title>

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.4/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .img-back {
            background-image: url("/img/aimyon4.png");
            background-size: cover;
            height: 100vh;
            width: 100%;
            z-index: -99;
            position: absolute;
            top: 0px;
        }
        .img-back::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0.1;
            z-index: -1;
        }
        p{
            font-size: 20px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <span class="img-back"></span>
    <h2 class="text-center my-4">[ 시큐리티 관련 타임리프 테스트 ]</h2>

    <div class="text-center">
        <!-- /* 로그인 */   -->
        <div sec:authorize="isAuthenticated()">
            <p>로그인</p>
            <!-- /* 여기서 name은 ID 임 */ -->
            <p> 아이디 : <span th:text="${#authentication.name}"></span></p>

            <!-- /* 이부분때문에 권한 관련해서 security 쓰려면 role_ 로 시작하는 명칭으로
             DB에 저장되어있어야함  */ -->

            <p sec:authorize="hasRole('NORMAL')">일반 사용자입니다.</p>
            <p sec:authorize="hasRole('ADMIN')">관리자급 사용자입니다.</p>

            <p>principal <span th:text="${#authentication.principal}"></span></p>
            <p>principal.name <span th:text="${#authentication.principal.name}"></span></p>
        </div>

        <!-- /* 로그인 안한 경우  */   -->
        <div sec:authorize="!isAuthenticated()">
            <p>미로그인</p></ㅔ>
            <p> 아이디 : <span th:text="${#authentication.name}"></span></p>
        </div>

        <button class="btn btn-secondary btn-lg" th:onclick="|location.href='@{/}'|">홈으로</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.4/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>

    </script>
</body>
</html>
