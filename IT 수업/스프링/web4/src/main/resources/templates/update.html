<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://i.namu.wiki/i/_gAD8r8NImxVgRK31XohV58sp3zmDZGi1u73QyTUgwWeg15Sve1n-5nQqcLctSugUvVmlqSOP1sJ6iLUWczcvg.webp">
    <title>Title</title>
    <!-- 부트스트랩 css  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #board-container {
            width: 800px;
            height: 450px;
            border: 1px solid black;
            border-radius: 5px;
        }
        .field-error {
            border-color: #dc3545;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <h2 class="text-center my-5"> 수정 <span></span></h2>

    <form class="container p-4 d-flex flex-column justify-content-evenly" id="board-container" th:action method="post" th:object="${guestbook}">
        <div class="mb-3 row">
            <input type="hidden" th:field="*{boardNum}" id="boardNum">
            <label for="userName" class="col-sm-2 col-form-label">이름</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="userName" th:value="*{userName}" name="userName" th:errorclass="field-error">
                <div th:errors="*{userName}" class="field-error"></div>
            </div>
        </div>
        <div class="mb-3 row">
            <label for="password" class="col-sm-2 col-form-label">비밀번호</label>
            <div class="col-sm-10">
                <input type="password" class="form-control" id="password" name="password" th:value="*{password}" th:errorclass="field-error">
                <div th:errors="*{password}" class="field-error"></div>
            </div>
        </div>
        <div class="mb-3 row">
            <label for="message" class="col-sm-2 col-form-label">내용</label>
            <div class="col-sm-10">
                <textarea class="form-control" id="message" name="message" style="resize: none; height: 200px;" th:text="*{message}" th:errorclass="field-error"></textarea>
                <div th:errors="*{message}" class="field-error"></div>
            </div>
        </div>
        <div class="row">
            <button type="submit" class="btn btn-primary col-2 mx-1">저장</button>
            <button type="button" class="btn btn-secondary col-2 mx-1"><a class="link-light link-underline-opacity-0" th:href="@{/detail/{boardNum}(boardNum=${boardNum})}">돌아가기</a></button>
        </div>
    </form>

    <!-- 부트스트랩 js  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        document.getElementById('deleteBtn').addEventListener('click', () => {

            const passwordInput = prompt("삭제하시려면 비밀번호를 입력해 주세요")
            const password = document.getElementById('password').value;
            const boardNum = document.getElementById('boardNum').value;

            if (passwordInput.trim() == '' || passwordInput.trim() != password) {
                alert("비밀번호가 다릅니다.");
            } else {
                window.location.href = `/delete/${boardNum}?password=${password}`;
            }

        })
    </script>
</body>
</html>
