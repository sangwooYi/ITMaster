<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkU0BR2no36LRsxt8BqXVk_soTAn3lkaFvNA&s">
    <title>Document</title>
</head>
<body>
    <h1>[ 배열, 내장객체 ]</h1>
    
    <button onclick="test1()">Array 객체</button>
    <button onclick="test2()">String 객체</button>
    <button onclick="test3()">예제</button>

    <script>
        function test1() {

            let arr1 = [10, 20];
            let arr2 = [];
            let arr3 = new Array();
            let arr4 = new Array(5, );    // 칸수 설정 ( 숫자 하나만 인자로 넣을때는 예외로 칸수가 설정되는 것)
            
            // 이렇게 원소를 집어넣으면 원소가 들어간 배열
            let arr5 = new Array(1, 22, 7, 2, 11, 10);

            console.log(arr1);
            console.log(arr2);
            console.log(arr3);
            console.log(arr4);
            console.log(arr5);
            console.log(arr1[5])    // 현재 범위에 벗어난 인덱스로 검색해도 에러가 아닌 undefined 가 출력된다.

            // 기본적으로 .sort() 는 문자열 기준으로 정렬한다.
            arr5.sort();
            console.log("arr.sort")
            console.log(arr5);

            // 따라서 별도로 기준을 정의해줘야함
            arr5.sort((a, b) => {
                return a-b;
            })
            console.log("arr.sort 별도로 기준 정의")
            console.log(arr5);
            /*
                // 이런식으로 정렬 기준을 별도로 설정 할 수 있다.
                arr5.sort(function (a, b) {
                return a - b;
                });            
            */


            arr5.reverse();
            console.log("arr.reverse")
            console.log(arr5);
            // 두번째부터 1개 삭제 splice(a, b) a번쨰부터 b개 삭제
            arr5.splice(2, 1);
            

        }

        function test2() {
            const arr1 = ["aa", "bb"]
            // 배열의 있는 정보를 설정한 연결자로 합쳐서 str 으로 반환해 줌
            const b =  arr1.join("-");
            console.log(b);
            let cont = "JavaScript is Fxxxx";
            cont.length // 문자열 길이
            console.log(`includes = ${cont.includes('Java')}`)  // 포함여부
            console.log(`indexOf = ${cont.indexOf('is')}`)      // 찾으려는게 최초로 나오는 위치 (인덱스)
            console.log(`substring = ${cont.substring(1, 3)}`)   // 부분문자열  substring(a, b) a인덱스 위치부터 b 인덱스 직전까지
                                                                 // 그냥 substring(a) 이러면 a 인덱스 위치부터 전체
            console.log(`replace = ${cont.replace('Java', "Python")}`)  // 문자열 대체
        }

        function test3() {
            const juminNo = prompt("주민번호 입력");

            const juminArr = juminNo.split("-");
            const chkArr = ["1", "2", "3", "4"];

            const sungFlag = juminArr[1].substring(0, 1);

            if (juminArr.length != 2 || juminArr[0].length != 6 || juminArr[1].length != 7) {
                alert("형태는 aaaaaa-bbbbbbb 형태여야함")
                return;
            }

            if (isNaN(juminArr[0]) || isNaN(juminArr[1])) {
                alert("주민번호 앞, 뒤 부분에 숫자 외에 값이 입력되어있습니다.");
                return;
            }

            if (!chkArr.includes(sungFlag) ) {
                alert("뒷자리의 맨 앞자리는 1, 2, 3, 4 중에 하나입니다.")
                return;
            }

            let birthYear = "";

            if (sungFlag == "1" || sungFlag == "2" ) {
                birthYear = "19"+juminArr[0].substring(0, 2);
            } else {
                birthYear = "20"+juminArr[0].substring(0, 2);
            }

            birthYear = Number(birthYear);
            const today = new Date();
            const curYear = today.getFullYear();
            let sung = ""
            let age = curYear-birthYear;

            if (age <= 0) {
                alert("장난치냐.. 진짜 나이 입력해");
                return;
            }

            if (Number(sungFlag)%2 == 0) {
                sung = "여자";
            } else {
                sung = "남자";
            }

            alert(`주민번호 : ${juminNo}, 나이 : ${curYear-birthYear}, 성별 : ${sung}`);
        }

    </script>
</body>
</html>
