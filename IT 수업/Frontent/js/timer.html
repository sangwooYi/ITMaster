<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; flex-direction: row; justify-content: center; align-items: center;">
    <p id="timer" style="font-size: 25px;"></p>

    <script> 
        let num = 1;
        const interval = setInterval(()=> {
            document.getElementById("timer").innerText = num;
            num += 1;
            
            if (num == 10) {
                clearInterval(interval);

                // 주의할점 closePopup() 이렇게 하면 안된다.
                // closePopup 는 함수 참조 (콜백) // closePopup() 는 해당 함수 즉시 실행
                // 반드시 참조 형태로 작성해야 제대로 작동함!
                setTimeout(closePopup, 500); // 현재 창 끄기 조금 여유를 주어야 9가 찍힘;
            }
        }, 1000)
        
        function closePopup() {
            window.close();
        }
    </script>
</body>
</html>
