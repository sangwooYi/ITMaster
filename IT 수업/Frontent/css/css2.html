    <!-- 우선순위 태그 < 클래스 < id < 인라인 < important //

    따라서 우선순위가 p.text2 > .text ( 같은 급에서는 더 자세하게 지정한게 우선순위가 높다 ) -->
    <style>
        .text2 {
            color: green;
        }
    </style>
