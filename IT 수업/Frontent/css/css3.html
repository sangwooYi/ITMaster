    <title>Document</title>
    <style>
        .table1 {
            border-collapse: collapse;
            width: 60%;
            height: 100px;
            /* margin 에서 auto 는 정중앙에 배치하겠다는 의미 값이 두개이므로 위아래는 8px , 좌우는 정중앙에 하겠다는 선언*/
            margin: 10px auto;
            border: 1px solid black;
            
        }
        th, td {
            padding: 10px;
            border: 2px dashed black;
            background-color: rgba(80, 200, 210, 0.7);
        }

        tr:nth-child(2n) {
            background-color: rgb(153, 255, 51);
        }

        th:hover, td:hover {
            background-color: tomato;
            border: 3px solid rgb(176, 102, 255);
            cursor: pointer;
        }

        .div1 {
            width: 100vw;
            margin: 1vw;
            text-align: center;
        }
    </style>
</head>
