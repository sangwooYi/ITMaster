<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .req-title::before {
            content: "*";
            color: red;
            margin: 5px;
        }        
        table {
            border-collapse:collapse;
            display: table-cell;
            vertical-align: middle;
        }
        td {
            padding: 10px 15px;
        }
        td:first-child {
            background-color: #cccccc;
        }
        .redtext {
            color: red;
        }
        .alert-text {
            font-size: 14px;
        }

        #main-cont {
            width: 900px;
        }
    </style>
</head>
<body>
    <div id="main-cont">
        <h1>회원가입_회원정보 입력</h1>
    
        <h4>홈 > 회원 > 회원가입</h4>
        <h4>회원정보 입력</h4>
    
        <h4>* 표시된 항목은 <span class="redtext">필수입력 </span>항목입니다.</h4>
    
        <form action="#" method="post">
            <table>
                <colgroup>
                    <col style="width: 180px;">
                    <col style="width: 700px;">
                </colgroup>
                <tr>
                    <td>이름</td>
                    <td>이상우</td>
                </tr>
                <tr>
                    <td class="req-title">아이디</td>
                    <td>
                        <div>
                            <input type="text" name="id">
                            <button type="button">중복확인</button>
                        </div>
                        <p>영문소문자,숫자 5~12자</p>
                    </td>
                </tr>
                <tr>
                    <td class="req-title">비밀번호</td>
                    <td>
                        <div>
                            <input type="password" name="pw" id="pw">
                            <span class="alert-text">영문, 숫자, 특수문자 중 2가지 이상 혼합하여 10~15자로 입력하세요.</span>
                        </div>
                        <p class="alert-text">※ 특수문자는 "~@#*()...|만 사용 가능합니다.</p>
                    </td>
                </tr>
                <tr>
                    <td class="req-title">비밀번호 확인</td>
                    <td><input type="text" name="pw-check"></td>
                </tr>
                <tr>
                    <td class="req-title">연락처</td>
                    <td>
                        <p class="alert-text">※ 유선전화와 휴대 전화중 한 가지는 입력하여 주시기 바랍니다.</p>
                        <div>
                            <span>전화번호</span>
                            <select name="tel-head" id="tel">
                                <option value="02" selected>02</option>
                                <option value="031">031</option>
                                <option value="007">007</option>
                            </select>
                            -
                            <input type="text" name="tel-mid">
                            -
                            <input type="text" name="tel-rear">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="req-title">이메일</td>
                    <td>
                        <input type="text" name="email-id">
                        -
                        <select name="domain-option" id="domain">
                            <option value="" selected>직접입력</option>
                            <option value="naver">naver.com</option>
                            <option value="daum">daum.net</option>
                            <option value="google">google.com</option>
                        </select>
                        <input type="text" name="domain">
                    </td>
                </tr>
                <tr>
                    <td class="req-title">주소</td>
                    <td>    
                        <select name="address-f" id="address-f">
                            <option value="" selected>선택</option>
                            <option value="seoul">서울시</option>
                            <option value="kyongi">경기도</option>
                        </select>
                        <input type="text" name="address">
                    </td>
                </tr>
                <tr>
                    <td class="req-title">정보수신 동의</td>
                    <td>
                        <span>이메일 수신 </span>
                        <input type="radio" name="mail-agree" id="mail-agree">
                        <label for="mail-agree">예</label>
                        <input type="radio" name="mail-agree" id="mail-disagree">
                        <label for="mail-disagree">아니오</label>
                        <hr>
                        <label for="kakao-agree">카카오톡 수신</label>
                        <input type="checkbox" name="kakao-agree" id="kakao-agree">
                    </td>
                </tr>      
            </table>
            <div style="text-align: center;">
                <button type="submit">가입하기</button>
                <button type="button">취소</button>
            </div>              
        </form>
    </div>
</body>
</html>
