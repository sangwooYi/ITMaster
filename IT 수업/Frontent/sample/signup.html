<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkU0BR2no36LRsxt8BqXVk_soTAn3lkaFvNA&s">
    <title>AimStore</title>
    <link rel="stylesheet" href="../css/priority.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>    

    <style>
        .my-cont {
            width: 40vw;
        }
        .title {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
        }
        .move-center {
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
        .my-button {
            padding: 3px;
            margin: 3px;
            width: 7vw;
        }
    </style>
</head>
<body>
    <div class="container-md my-cont">
        <form>
        <p class="title">[ 회원가입 ]</p>
        <div class="row mb-3">
            <label for="inputID3" class="col-sm-2 col-form-label">ID</label>
            <div class="col">
                <input type="text" class="form-control" id="inputID3">
            </div>
            <div class="col">
                <button class="btn btn-secondary btn-sm" type="button">ID 중복확인</button>
            </div>
        </div>        
        <div class="row mb-3">
            <label for="inputPassword3" class="col-sm-2 col-form-label">비밀번호</label>
            <div class="col">
            <input type="password" class="form-control" id="inputPassword3">
            </div>
            <div class="col">
            </div>
        </div>    
        <div class="row mb-3">
            <label for="inputName3" class="col-sm-2 col-form-label">이름</label>
            <div class="col">
            <input type="name" class="form-control" id="inputName3">
            </div>
            <div class="col">
            </div>
        </div>            
        <div class="row mb-3">
            <label for="inputEmail3" class="col-sm-2 col-form-label">이메일</label>
            <div class="col">
            <input type="email" class="form-control" id="inputEmail3">
            </div>
            <div class="col">
            </div>
        </div>
        <div class="row mb-3">
            <label for="inputTel3" class="col-sm-2 col-form-label">전화번호</label>
            <div class="col">
            <input type="number" class="form-control" id="inputTel3">
            </div>
            <div class="col">
            </div>
        </div>    
        <div class="row mb-3">
            <label for="inputAddress3" class="col-sm-2 col-form-label">주소</label>
            <div class="col">
            <input type="address" class="form-control" id="inputAddress3">
            </div>
        </div>   
        <div class="move-center">
            <button type="submit" class="btn btn-primary my-button">가입</button>
            <button type="button" class="btn btn-secondary my-button">다시 쓰기</button>
        </div>
        </form>
    </div>
</body>
</html>
