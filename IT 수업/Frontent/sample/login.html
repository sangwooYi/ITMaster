<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkU0BR2no36LRsxt8BqXVk_soTAn3lkaFvNA&s">
    <title>AimStore</title>
    <link rel="stylesheet" href="../css/priority.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>    
    <style>
        .my-cont {
            width: 30vw;
        }
        .title {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
        }
        .move-center {
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
        button {
            padding: 3px;
            margin: 3px;
            width: 7vw;
        }        
    </style>
</head>
<body>
    <div class="container-md my-cont">
        <form>
        <p class="title">[ 로그인 ]</p>
        <div class="row mb-3">
            <label for="inputID3" class="col-sm-2 col-form-label">ID</label>
            <div class="col">
                <input type="text" class="form-control" id="inputID3">
            </div>
        </div>        
        <div class="row mb-3">
            <label for="inputPassword3" class="col-sm-2 col-form-label">Password</label>
            <div class="col">
            <input type="password" class="form-control" id="inputPassword3">
            </div>
        </div>    
        <div class="move-center">
            <button type="submit" class="btn btn-primary my-button">Login</button>
        </div>
        </form>
    </div>
</body>
</html>
