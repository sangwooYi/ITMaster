<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkU0BR2no36LRsxt8BqXVk_soTAn3lkaFvNA&s">
    <title>AimStore</title>
    <link rel="stylesheet" href="../css/priority.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>    

    <style>
        .my-cont {
            width: 80vw;
        }
        .title {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
        }
        .move-center {
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
        .my-button {
            padding: 3px;
            margin: 3px;
            width: 7vw;
        }
        .flex-left {
            display: flex;
            flex-direction: row;
            justify-content: start;
        }
    </style>
</head>
<body>
    <div class="container-md my-cont">
        <form>
        <p class="title">[ 글쓰기 ]</p>
        <div class="row mb-3">
            <label for="inputTitle3" class="col-sm-2 col-form-label">제목</label>
            <div class="col">
                <input type="text" class="form-control" id="inputTitle3">
            </div>
        </div>        
        <div class="row mb-3">
            <label for="inputContent" class="col-sm-2 col-form-label">내용</label>
            <div class="col">
                <textarea class="form-control" aria-label="With textarea" id="inputContent" style="height: 200px;"></textarea>
            </div>
        </div>    
        <div class="row mb-3">
            <div class="col-2">
                파일첨부
            </div>
            <div class="col flex-left">
                <button class="btn btn-secondary btn-sm" style="margin-right: 10px;">파일선택</button>
                <span>선택한 파일 없음</span>
            </div>
        </div>   
        <div class="move-center">
            <button type="submit" class="btn btn-primary my-button">저장</button>
        </div>
        </form>
    </div>
</body>
</html>
